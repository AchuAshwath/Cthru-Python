<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="680" height="400" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Terminal Titlebar -->
  <rect x="10" y="10" width="680" height="38" rx="14" fill="#0f172a"/>
  <circle cx="34" cy="29" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="52" cy="29" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="70" cy="29" r="6" fill="#10b981" opacity="0.8"/>
  <text x="350" y="33" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="12" font-weight="600">CPython Memory Inspector — PID 42091</text>

  <!-- Left Column: Call Stack -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="230" height="310" rx="8" fill="#0f172a" stroke="#334155" stroke-dasharray="3 3"/>
    <rect x="0" y="0" width="230" height="32" rx="8" fill="#1e293b"/>
    <text x="16" y="21" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12" font-weight="bold">PyFrameObject ('main')</text>
    <text x="180" y="21" fill="#475569" font-family="ui-monospace, monospace" font-size="10">STACK</text>

    <!-- Variable a -->
    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="14" y="24" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="bold">name: "a"</text>
      <text x="14" y="40" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">ptr: 0x10f440</text>
      <circle cx="190" cy="25" r="5" fill="#38bdf8" filter="url(#glow)"/>
    </g>

    <!-- Variable b -->
    <g transform="translate(15, 120)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="14" y="24" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="bold">name: "b"</text>
      <text x="14" y="40" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">ptr: 0x10f440</text>
      <circle cx="190" cy="25" r="5" fill="#38bdf8" filter="url(#glow)"/>
    </g>

    <!-- Variable c -->
    <g transform="translate(15, 185)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#1e293b" stroke="#64748b"/>
      <text x="14" y="24" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13" font-weight="bold">name: "c"</text>
      <text x="14" y="40" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">ptr: 0x10a080</text>
      <circle cx="190" cy="25" r="4" fill="#64748b"/>
    </g>
    
    <text x="15" y="280" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">f_lasti: 14 (STORE_NAME)</text>
    <text x="15" y="296" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">f_lineno: 3</text>
  </g>

  <!-- Pointer Beziers (Arrows) -->
  <path d="M 245 150 C 310 150, 320 120, 390 120" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  <polygon points="386,115 396,120 386,125" fill="#38bdf8"/>

  <path d="M 245 215 C 310 215, 320 140, 390 130" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="386,125 396,130 386,135" fill="#38bdf8"/>

  <path d="M 245 280 C 310 280, 330 290, 390 290" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="386,286 396,290 386,294" fill="#64748b"/>

  <!-- Right Column: Private Heap Objects -->
  <g transform="translate(395, 70)">
    <!-- Heap Object 1: PyListObject -->
    <rect x="0" y="0" width="265" height="170" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="265" height="30" rx="8" fill="#1e3a8a"/>
    <text x="14" y="20" fill="#bfdbfe" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">PyListObject @ 0x10f440</text>
    <text x="210" y="20" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="10">HEAP</text>

    <!-- PyObject Header Details -->
    <g transform="translate(14, 45)">
      <text x="0" y="14" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">ob_refcnt:</text>
      <rect x="80" y="0" width="36" height="20" rx="4" fill="#10b981" opacity="0.2"/>
      <text x="98" y="14" text-anchor="middle" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">2</text>

      <text x="0" y="38" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">ob_type:</text>
      <text x="80" y="38" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">&amp;PyList_Type</text>

      <text x="0" y="62" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">ob_size:</text>
      <text x="80" y="62" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">3 elements</text>

      <!-- Items array -->
      <rect x="0" y="78" width="235" height="34" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="8" y="100" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">**ob_item:</text>
      <rect x="75" y="84" width="45" height="22" rx="3" fill="#0f172a"/>
      <text x="97" y="99" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">[ 1 ]</text>
      <rect x="125" y="84" width="45" height="22" rx="3" fill="#0f172a"/>
      <text x="147" y="99" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">[ 2 ]</text>
      <rect x="175" y="84" width="45" height="22" rx="3" fill="#0f172a"/>
      <text x="197" y="99" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="11">[ 3 ]</text>
    </g>

    <!-- Heap Object 2: PyLongObject -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="265" height="110" rx="8" fill="#0f172a" stroke="#475569"/>
      <rect x="0" y="0" width="265" height="28" rx="8" fill="#1e293b"/>
      <text x="14" y="19" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">PyLongObject @ 0x10a080</text>
      <text x="210" y="19" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">HEAP</text>

      <g transform="translate(14, 40)">
        <text x="0" y="16" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">ob_refcnt: 1</text>
        <text x="0" y="38" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">value: 1000 (28 bytes allocated)</text>
        <rect x="0" y="48" width="180" height="16" rx="3" fill="#334155" opacity="0.4"/>
        <text x="6" y="60" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9">SINGLETON: FALSE (&gt;256)</text>
      </g>
    </g>
  </g>
</svg>
